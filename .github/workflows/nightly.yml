name: 밤10시 뉴스 정리보고

on:
  schedule:
    - cron: "1 13 * * *"    # 22:01 KST (크론이 작동할 경우의 본 실행 — 현재는 보험)
    - cron: "21 13 * * *"   # 22:21 KST 예비
    - cron: "41 13 * * *"   # 22:41 KST 예비
  workflow_dispatch:
    inputs:
      auto:
        description: "속보 루프의 자동 트리거 여부"
        required: false
        default: ""

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  actions: write            # 실패 매체 자동 보충(nightly-retry.yml) 디스패치용

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60          # KBS부산 뉴스9 클로징 대기(최대 22:40)분 포함
    steps:
      - uses: actions/checkout@v4
      - name: 오늘 밤 이미 발송했는지 확인 (자동 실행만 해당)
        id: guard
        if: github.event_name == 'schedule' || github.event.inputs.auto == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ① KST 21~23시 창 밖의 자동 실행은 차단 — 지연 발화 크론이 UTC 자정을 넘기면
          #    "오늘(UTC)" 기준 카운트가 0이 돼 아침에 재발송되는 구멍 방지 (2026-08-15)
          h=$(TZ=Asia/Seoul date +%H)
          if [ "$h" -lt 21 ]; then
            echo "already=99" >> "$GITHUB_OUTPUT"
            echo "KST ${h}시 — 방송 시간대(21~23시) 밖의 자동 실행이라 건너뜀"
            exit 0
          fi
          # ② 오늘 밤 이미 성공 발송했으면 건너뜀
          today=$(date -u +%Y-%m-%d)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly.yml/runs?status=success&created=%3E${today}T12:30:00Z" -q '.total_count')
          echo "already=$n" >> "$GITHUB_OUTPUT"
          echo "오늘 밤 성공 발송 횟수: $n"
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.already == '0' || steps.guard.outcome == 'skipped'
        with:
          node-version: "22"
      - name: 의존성 설치 (Puppeteer 크롬 포함)
        if: steps.guard.outputs.already == '0' || steps.guard.outcome == 'skipped'
        working-directory: nightly
        run: |
          npm ci
          npx puppeteer browsers install chrome
      - name: 수집 → 엑셀 → 텔레그램 전송
        if: steps.guard.outputs.already == '0' || steps.guard.outcome == 'skipped'
        working-directory: nightly
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_NIGHTLY_TOKEN }}
          # 통합 그룹의 "📺 TV 모니터링" 주제로 발송 ("그룹ID:주제ID"). 미설정 시 기존 방.
          TG_CHAT_ID: ${{ secrets.TG_NIGHTLY_CHAT || secrets.TG_CHAT_ID }}
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
        run: node run.mjs
      - name: 실패 매체가 있으면 30분 뒤 자동 보충(클라우드 재시도) 예약
        if: steps.guard.outputs.already == '0' || steps.guard.outcome == 'skipped'
        working-directory: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=$(node -e '
            const d = JSON.parse(require("fs").readFileSync("data/broadcasters.json","utf8"));
            const f = d.sources.filter(s => s.items.length === 0 && s.note && !/\(정상\)$/.test(s.note)).map(s => s.source);
            process.stdout.write(f.join(","));
          ')
          date=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("data/broadcasters.json","utf8")).date.replace(/-/g,""))')
          if [ -n "$failed" ]; then
            echo "실패 매체: $failed → nightly-retry 디스패치"
            gh workflow run nightly-retry.yml -R ${{ github.repository }} -f date="$date" -f sources="$failed"
          else
            echo "실패 매체 없음"
          fi
