name: 주제 생성·이름 변경(봇 API)

on:
  workflow_dispatch:
    inputs:
      name:
        description: "주제 이름(새로 만들거나 바꿀 이름)"
        required: true
      thread_id:
        description: "비우면 새 주제 생성, 적으면 그 주제의 이름을 바꿈(editForumTopic)"
        required: false
        default: ""

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: createForumTopic / editForumTopic
        env:
          TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GROUP: ${{ secrets.TG_TOPIC_GROUP }}
          NAME: ${{ inputs.name }}
          THREAD: ${{ inputs.thread_id }}
        run: |
          # 주제 ID(message_thread_id)는 비밀이 아니므로 로그에 남긴다. 토큰·그룹 ID는 출력하지 않는다.
          if [ -n "$THREAD" ]; then
            res=$(curl -s -X POST "https://api.telegram.org/bot${TOKEN}/editForumTopic" --data-urlencode "chat_id=${GROUP}" --data-urlencode "message_thread_id=${THREAD}" --data-urlencode "name=${NAME}")
            echo "$res" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);if(j.ok)console.log("RENAMED THREAD_ID="+process.env.THREAD+" NAME="+process.env.NAME);else{console.log("FAILED: "+j.description);process.exit(1)}})'
          else
            res=$(curl -s -X POST "https://api.telegram.org/bot${TOKEN}/createForumTopic" --data-urlencode "chat_id=${GROUP}" --data-urlencode "name=${NAME}")
            echo "$res" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);if(j.ok)console.log("THREAD_ID="+j.result.message_thread_id+" NAME="+j.result.name);else{console.log("FAILED: "+j.description);process.exit(1)}})'
          fi
