name: 지면 스크랩 검증 (일회성)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 의존성 설치
        working-directory: nightly
        run: |
          npm ci
          npx puppeteer browsers install chrome
      - name: 지면 스크랩 테스트
        working-directory: nightly
        run: node test-papers.mjs
