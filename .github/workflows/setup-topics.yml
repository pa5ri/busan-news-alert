name: 주제 셋업 (일회성)

on:
  workflow_dispatch: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 통합 주제 생성 + 봇별 발송 검증
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_NIGHTLY_TOKEN: ${{ secrets.TG_NIGHTLY_TOKEN }}
          TG_BRIEF_TOKEN: ${{ secrets.TG_BRIEF_TOKEN }}
          TG_ORD_TOKEN: ${{ secrets.TG_ORD_TOKEN }}
          TG_BILL_TOKEN: ${{ secrets.TG_BILL_TOKEN }}
          TG_TOPIC_GROUP: ${{ secrets.TG_TOPIC_GROUP }}
        run: node setup_topics.mjs
