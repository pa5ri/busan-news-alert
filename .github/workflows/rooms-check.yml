name: 방 점검·보충 (일회성)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "e2e | backfill"
        required: true
        default: "e2e"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: 실행
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_TOPIC_GROUP: ${{ secrets.TG_TOPIC_GROUP }}
          TG_TOPICS: ${{ secrets.TG_TOPICS }}
        run: |
          if [ "${{ inputs.mode }}" = "backfill" ]; then
            node backfill-chief2.mjs
          else
            node e2e-rooms.mjs
          fi
