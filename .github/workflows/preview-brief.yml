name: 브리핑 미리보기 (일회성)

on:
  workflow_dispatch: {}

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 발송
        env:
          TG_BRIEF_TOKEN: ${{ secrets.TG_BRIEF_TOKEN }}
          TG_TOPIC_GROUP: ${{ secrets.TG_TOPIC_GROUP }}
          TG_TOPICS: ${{ secrets.TG_TOPICS }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node preview_brief.mjs
