name: 르포·기고 누락분 보충 (일회성)
on:
  workflow_dispatch:
    inputs:
      skip_urls: { description: "이미 보낸 URL(쉼표)", required: false, default: "" }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: 보충 발송
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_TOPIC_GROUP: ${{ secrets.TG_TOPIC_GROUP }}
          TG_TOPICS: ${{ secrets.TG_TOPICS }}
          SKIP_URLS: ${{ inputs.skip_urls }}
        run: node backfill_missed.mjs
