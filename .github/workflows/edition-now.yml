name: 부산 지면 수동 발송

on:
  workflow_dispatch:
    inputs:
      date:
        description: "날짜 YYYYMMDD (비우면 오늘 KST)"
        required: false
        default: ""

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 지면 발송
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_TOPIC_GROUP: ${{ secrets.TG_TOPIC_GROUP }}
          TG_TOPICS: ${{ secrets.TG_TOPICS }}
        run: node edition-now.mjs ${{ inputs.date }}
