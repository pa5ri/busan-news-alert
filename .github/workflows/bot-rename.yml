name: 봇 표시명 통일 (일회성)

on:
  workflow_dispatch:
    inputs:
      name:
        description: "표시명"
        required: true
        default: "부산 통합 모니터링 봇"

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 봇 5개 setMyName
        env:
          NEW_NAME: ${{ inputs.name }}
          T_LIVE: ${{ secrets.TG_BOT_TOKEN }}
          T_BRIEF: ${{ secrets.TG_BRIEF_TOKEN }}
          T_NIGHTLY: ${{ secrets.TG_NIGHTLY_TOKEN }}
          T_ORD: ${{ secrets.TG_ORD_TOKEN }}
          T_BILL: ${{ secrets.TG_BILL_TOKEN }}
        run: |
          node - <<'EOF'
          const bots = [["실시간(live)", process.env.T_LIVE], ["브리핑(brief)", process.env.T_BRIEF], ["TV(nightly)", process.env.T_NIGHTLY], ["입법예고(ord)", process.env.T_ORD], ["의안(bill)", process.env.T_BILL]];
          const name = process.env.NEW_NAME;
          for (const [label, tok] of bots) {
            if (!tok) { console.log(label, "토큰 없음 — 건너뜀"); continue; }
            const api = (m, b) => fetch(`https://api.telegram.org/bot${tok}/${m}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b || {}) }).then(r => r.json());
            const before = await api("getMyName");
            const r = await api("setMyName", { name });
            const after = await api("getMe");
            console.log(`${label}: "${before.result?.name}" → ${r.ok ? "OK" : "실패 " + JSON.stringify(r).slice(0, 120)} → 현재 "${after.result?.first_name}" (@${after.result?.username})`);
            await new Promise(r => setTimeout(r, 1500));
          }
          EOF
