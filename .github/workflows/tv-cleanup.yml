name: TV 방 빈 보충 메시지 삭제 (일회성)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 야간봇이 방금 보낸 0건 메시지 삭제 (탐침 id부터 내려가며 자기 메시지만 삭제 가능)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_NIGHTLY_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_NIGHTLY_CHAT || secrets.TG_CHAT_ID }}
        run: |
          node - <<'EOF'
          const [chat, thread] = String(process.env.TG_CHAT_ID).split(",")[0].split(":");
          const api = (m, b) => fetch(`https://api.telegram.org/bot${process.env.TG_BOT_TOKEN}/${m}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) }).then(r => r.json());
          const probe = await api("sendMessage", { chat_id: chat, ...(thread ? { message_thread_id: Number(thread) } : {}), text: "." });
          if (!probe.ok) { console.error("탐침 실패", JSON.stringify(probe)); process.exit(1); }
          const N = probe.result.message_id;
          await api("deleteMessage", { chat_id: chat, message_id: N });
          let deleted = 0;
          for (let id = N - 1; id >= N - 60; id--) {
            const r = await api("deleteMessage", { chat_id: chat, message_id: id });
            if (r.ok) { console.log("삭제:", id); deleted++; break; }   // 이 봇이 최근 보낸 건 0건 메시지 하나뿐
            await new Promise(r => setTimeout(r, 150));
          }
          console.log("탐침 id", N, "| 삭제", deleted, "건");
          EOF
