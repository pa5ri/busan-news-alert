name: 여야 시당위원장 방 재구성 (일회성)
on:
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: 업로드
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_TOPIC_GROUP: ${{ secrets.TG_TOPIC_GROUP }}
          TG_TOPICS: ${{ secrets.TG_TOPICS }}
        run: node backfill_chief.mjs
