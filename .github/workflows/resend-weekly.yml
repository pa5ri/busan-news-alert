name: 주간 리포트 재발송 (일회성)

on:
  workflow_dispatch: {}

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 재발송
        env:
          TG_BRIEF_TOKEN: ${{ secrets.TG_BRIEF_TOKEN }}
          TG_TOPIC_GROUP: ${{ secrets.TG_TOPIC_GROUP }}
          TG_TOPICS: ${{ secrets.TG_TOPICS }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node resend_weekly.mjs
