name: 임시 진단(부산MBC)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - working-directory: nightly
        run: |
          npm ci
          npx puppeteer browsers install chrome
          node dbg-bmbc.mjs
