name: 봇 이름 최소화 (일회성)

on:
  workflow_dispatch: {}

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 표시이름 변경
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_NIGHTLY_TOKEN: ${{ secrets.TG_NIGHTLY_TOKEN }}
        run: node rename_bots.mjs
