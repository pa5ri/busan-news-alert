name: 부산시의회 소급 업로드 (일회성)

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: 소급 발송
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_TOPIC_GROUP: ${{ secrets.TG_TOPIC_GROUP }}
          TG_TOPICS: ${{ secrets.TG_TOPICS }}
        run: node backfill-council.mjs
